  <!-- Tailwind CSS CDN -->

  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: 'var(--color-accent, #0ea5e9)',

      --color-panel: #1a2436;

    [data-theme="black"] {
      --color-bg: #000000;
      --color-surface: #0a0a0c;
      --color-panel: #141417;
      --color-border: rgba(255, 255, 255, 0.1);

    [data-theme="dark-blue"] {
      --color-bg: #080e21;
      --color-surface: #0f1936;
      --color-panel: #1a284e;
      --color-border: rgba(96, 165, 250, 0.15);

    [data-theme="cyan-neon"] {

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow: hidden;
      user-select: none;
      margin: 0;

      -webkit-tap-highlight-color: transparent;

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }

  <script>
    window.onerror = function(msg, url, line, col, error) {
      var errDiv = document.getElementById('fatal-error');
      if (errDiv) {
        errDiv.style.display = 'block';
        errDiv.innerHTML = '<div style="padding:20px; background:#090d16; color:#f87171; font-family:monospace; z-index:9999; position:fixed; inset:0;">' +
          '<h2>NoahCord Handled Error</h2>' +
          '<p>' + msg + '</p>' +
          '<p>Line: ' + line + ' | Col: ' + col + '</p>' +
          '<button onclick="location.reload()" style="background:#0ea5e9;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:12px;">Reload Application</button>' +
          '</div>';
      }
      return false;
    };
  </script>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- Helper function for RFC4122 Compliant UUID Generation ---
    function generateUUID() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // --- Live Supabase Client Setup ---
    const SUPABASE_URL = "https://hcmglicybaitjqwkqice.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbWdsaWN5YmFpdGpxd2txaWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTAzMzAsImV4cCI6MjEwMTY4NjMzMH0.oIovdQqvUEKiAAfhkT9-sRCYNyjmcWCM-jglidYVA-4";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // --- SVG Icon Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        hash: <path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18" />,
        message: <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />,
        users: <g><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm14 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" /></g>,
        bell: <g><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" /></g>,
        settings: <path d="M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />,
        search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        send: <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />,
        trash: <g><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" /></g>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        sparkles: <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z" />,
        crown: <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z" />,
        x: <g><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></g>,
        logout: <g><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></g>,
        volume2: <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" /></g>,
        sidebar: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="9" y1="3" x2="9" y2="21" /></g>,
        chevronDown: <polyline points="6 9 12 15 18 9" />,
        chevronRight: <polyline points="9 18 15 12 9 6" />,
        menu: <g><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="18" x2="21" y2="18" /></g>,
        gif: <g><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M8 10H6v4h2v-2H7M12 10v4M15 10h3v1.5h-2v1H18V14h-3" /></g>
      };

      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || icons['hash']}
        </svg>
      );
    };

    const INITIAL_CATEGORIES = [
      {
        id: 'cat-text',
        name: 'Deck Operations',
        channels: [
          { id: 'chan-announcements', name: 'announcements', type: 'announcement', desc: 'Official updates from Noah_ & Fleet Command' },
          { id: 'chan-general', name: 'general', type: 'text', desc: 'Main deck chat for all Sailors' },
          { id: 'chan-lounge', name: 'lounge', type: 'text', desc: 'Relax and share stories from the seas' }
        ]
      },
      {
        id: 'cat-voice',
        name: 'Voice Decks',
        channels: [
          { id: 'chan-bridge', name: 'Captain Deck', type: 'voice', desc: 'Voice room for fleet leaders' }
        ]
      }
    ];

    const DEFAULT_ACCOUNTS = [
      { id: '343e0618-0000-4000-a000-000000000001', username: 'Noah_', displayName: 'Noah_ (Fleet Admin)', password: 'admin123', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200', role: 'admin', customStatus: '⚓ Fleet Captain' },
      { id: '343e0618-0000-4000-a000-000000000002', username: 'alex_sailor', displayName: 'Alex Mercer', password: 'sailor123', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200', role: 'member', customStatus: '⛵ Sailor' }
    ];

    const AppContext = createContext(null);

    const AppProvider = ({ children }) => {
      // Session Persistence
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('noahcord_active_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('noahcord_registered_accounts');
        return saved ? JSON.parse(saved) : DEFAULT_ACCOUNTS;
      });

      const [theme, setTheme] = useState(() => localStorage.getItem('noahcord_theme') || 'midnight');
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [activeChannelId, setActiveChannelId] = useState('chan-general');

      // Messages State: NO LOCALSTORAGE MESSAGES — Supabase is the single source of truth!
      const [messages, setMessages] = useState({});

      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [rightSidebarOpen, setRightSidebarOpen] = useState(false);

      const [logoClickCount, setLogoClickCount] = useState(0);
      const [toastMsg, setToastMsg] = useState(null);
      const [activeVoiceCall, setActiveVoiceCall] = useState(null);

      useEffect(() => {
        localStorage.setItem('noahcord_registered_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('noahcord_active_session', JSON.stringify(currentUser));
          ensureSupabaseProfile(currentUser);
        } else {
          localStorage.removeItem('noahcord_active_session');
        }
      }, [currentUser]);

      // Auto-upsert profile to Supabase DB so sender foreign key exists
      const ensureSupabaseProfile = async (userObj) => {
        if (!supabase || !userObj) return;
        try {
          await supabase.from('profiles').upsert({
            id: userObj.id,
            username: userObj.username,
            display_name: userObj.displayName || userObj.username,
            avatar_url: userObj.avatar,
            custom_status: userObj.customStatus || '⛵ Sailor',
            role: userObj.role || 'member'
          });
        } catch (e) {
          console.warn("Profile sync notice:", e);
        }
      };

      // Restore Supabase Auth Session
      useEffect(() => {
        if (!supabase) return;

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            fetchUserProfile(session.user.id);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            fetchUserProfile(session.user.id);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchUserProfile = async (userId) => {
        const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (data) {
          const userObj = {
            id: data.id,
            username: data.username,
            displayName: data.display_name,
            avatar: data.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
            banner: data.banner_url || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800',
            bio: data.bio || 'Cruising NoahCord waters.',
            pronouns: data.pronouns || 'they/them',
            role: data.role || (data.username === 'Noah_' ? 'admin' : 'member'),
            status: data.status || 'online',
            customStatus: data.custom_status || (data.username === 'Noah_' ? '⚓ Fleet Captain' : '⛵ Sailor')
          };
          setCurrentUser(userObj);
        }
      };

      // Load Messages Directly From Supabase for Channel
      const loadChannelMessages = async (chanId) => {
        if (!supabase) return;

        // Fetch profiles for sender metadata
        const { data: profs } = await supabase.from('profiles').select('*');
        const profMap = {};
        if (profs) {
          profs.forEach(p => { profMap[p.id] = p; });
          setAccounts(profs.map(p => ({
            id: p.id,
            username: p.username,
            displayName: p.display_name || p.username || 'Sailor',
            avatar: p.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
            role: p.role,
            customStatus: p.custom_status || '⛵ Sailor'
          })));
        }

        const { data: msgs, error } = await supabase
          .from('messages')
          .select('*')
          .eq('channel_id', chanId)
          .order('created_at', { ascending: true });

        if (!error && msgs) {
          const formatted = msgs.map(m => {
            const sender = profMap[m.sender_id];
            return {
              id: m.id,
              senderId: m.sender_id,
              senderName: sender?.display_name || sender?.username || 'Sailor',
              senderAvatar: sender?.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              content: m.content || '',
              timestamp: new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              poll: m.poll_data
            };
          });

          setMessages(prev => ({
            ...prev,
            [chanId]: formatted
          }));
        }
      };

      // Realtime Messages Subscription Across Devices
      useEffect(() => {
        if (!currentUser || !supabase) return;

        // Fetch latest messages from Supabase single source of truth
        loadChannelMessages(activeChannelId);

        // Realtime Subscription
        const channel = supabase.channel(`realtime:messages:${activeChannelId}`)
          .on(
            'postgres_changes',
            {
              event: 'INSERT',
              schema: 'public',
              table: 'messages',
              filter: `channel_id=eq.${activeChannelId}`
            },
            async (payload) => {
              const newMsg = payload.new;

              // Fetch sender details
              let senderName = 'Sailor';
              let senderAvatar = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200';

              const { data: senderProf } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', newMsg.sender_id)
                .single();

              if (senderProf) {
                senderName = senderProf.display_name || senderProf.username || 'Sailor';
                senderAvatar = senderProf.avatar_url || senderAvatar;
              }

              const formattedMsg = {
                id: newMsg.id,
                senderId: newMsg.sender_id,
                senderName,
                senderAvatar,
                content: newMsg.content || '',
                timestamp: new Date(newMsg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                poll: newMsg.poll_data
              };

              setMessages(prev => {
                const currentList = prev[activeChannelId] || [];

                // Deduplicate by ID
                if (currentList.some(m => m.id === formattedMsg.id)) {
                  return prev;
                }

                // Merge / Replace optimistic message if match found
                const optIndex = currentList.findIndex(
                  m => m.isOptimistic && m.senderId === formattedMsg.senderId && m.content === formattedMsg.content
                );

                let newList;
                if (optIndex !== -1) {
                  newList = [...currentList];
                  newList[optIndex] = formattedMsg;
                } else {
                  newList = [...currentList, formattedMsg];
                }

                return {
                  ...prev,
                  [activeChannelId]: newList
                };
              });
            }
          )
          .subscribe((status) => {
            if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
              // Auto-reconnect on connection drop
              setTimeout(() => loadChannelMessages(activeChannelId), 2000);
            }
          });

        return () => {
          supabase.removeChannel(channel);
        };
      }, [currentUser, activeChannelId]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('noahcord_theme', theme);
      }, [theme]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const handleLogoClick = () => {
        if (!currentUser) return;
        const newCount = logoClickCount + 1;
        setLogoClickCount(newCount);

        if (newCount < 10) {
          triggerToast(`System Override: ${newCount}/10 Clicks`);
        } else {
          setLogoClickCount(0);
          if (currentUser.username === 'Noah_') {
            setIsAdminModalOpen(true);
            triggerToast('🔓 Fleet Command Admin Unlocked!');
          } else {
            triggerToast('⛔ Access Denied! Security Clearance requires username: Noah_');
          }
        }
      };

      const logout = async () => {
        if (supabase) await supabase.auth.signOut();
        localStorage.removeItem('noahcord_active_session');
        setCurrentUser(null);
        setMobileMenuOpen(false);
        triggerToast('Logged out successfully.');
      };

      const updateProfile = async (updates) => {
        const updated = { ...currentUser, ...updates };
        setCurrentUser(updated);

        setAccounts(prev => prev.map(a => a.id === currentUser.id ? { ...a, ...updates } : a));

        if (supabase && currentUser.id) {
          await supabase.from('profiles').update({
            display_name: updates.displayName,
            username: updates.username,
            bio: updates.bio,
            pronouns: updates.pronouns,
            avatar_url: updates.avatar,
            banner_url: updates.banner,
            custom_status: updates.customStatus,
            status: updates.status
          }).eq('id', currentUser.id);
        }
        triggerToast('Profile updated!');
      };

      // Send Message function with Optimistic Rendering & Supabase Insertion
      const sendMessage = async (channelId, text, pollData = null) => {
        if (!currentUser) return;

        const tempId = generateUUID();

        const optimisticMsg = {
          id: tempId,
          senderId: currentUser.id,
          senderName: currentUser.displayName || currentUser.username || 'Sailor',
          senderAvatar: currentUser.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
          content: text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          poll: pollData,
          isOptimistic: true
        };

        // 1. Render immediately on sender device
        setMessages(prev => ({
          ...prev,
          [channelId]: [...(prev[channelId] || []), optimisticMsg]
        }));

        // 2. Insert into Supabase Single Source of Truth
        if (supabase) {
          await ensureSupabaseProfile(currentUser);

          const { error } = await supabase.from('messages').insert({
            id: tempId,
            channel_id: channelId,
            sender_id: currentUser.id,
            content: text,
            poll_data: pollData
          });

          if (error) {
            console.error('Supabase Sync Error:', error.message);
            triggerToast('Message error: ' + error.message);
          }
        }
      };

      const addChannel = (categoryName, channelName, desc = '') => {
        const formatted = channelName.toLowerCase().replace(/\s+/g, '-');
        const newChan = { id: 'chan-' + Date.now(), name: formatted, type: 'text', desc };

        setCategories(prev => prev.map(cat => {
          if (cat.name.toLowerCase() === categoryName.toLowerCase()) {
            return { ...cat, channels: [...cat.channels, newChan] };
          }
          return cat;
        }));
        triggerToast(`Channel #${formatted} created!`);
      };

      return (
        <AppContext.Provider value={{
          accounts, setAccounts,
          currentUser, setCurrentUser, logout, updateProfile,
          theme, setTheme,
          categories, addChannel,
          activeChannelId, setActiveChannelId,
          messages, sendMessage,
          isAdminModalOpen, setIsAdminModalOpen,
          isProfileModalOpen, setIsProfileModalOpen,
          rightSidebarOpen, setRightSidebarOpen,
          mobileMenuOpen, setMobileMenuOpen,

    const useApp = () => useContext(AppContext);

    // --- Strict Sign Up / Login Screen ---
    const AuthModal = () => {
      const { accounts, setAccounts, setCurrentUser, triggerToast } = useApp();
      const [isSignUp, setIsSignUp] = useState(true);
      const [username, setUsername] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        const inputRaw = username.trim();
        const isEmail = inputRaw.includes('@');
        const cleanUser = isEmail ? inputRaw.split('@')[0] : inputRaw;
        const email = isEmail ? inputRaw : `${cleanUser.toLowerCase().replace(/[^a-z0-9_]/g, '')}@noahcord.com`;

        try {
          if (isSignUp) {
            if (cleanUser.length < 3) throw new Error('Username must be at least 3 characters.');
            if (password.length < 4) throw new Error('Password must be at least 4 characters.');

            const existingAcc = accounts.find(a => a.username.toLowerCase() === cleanUser.toLowerCase());
            if (existingAcc) {
              throw new Error(`Username @${cleanUser} is already registered! Please switch to Log In.`);
            }

            let userId = generateUUID();

            if (supabase) {
              const { data } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { username: cleanUser, display_name: displayName.trim() || cleanUser } }
              });
              if (data?.user) {
                userId = data.user.id;
              }
            }

            const newProfile = {
              id: userId,
              username: cleanUser,
              displayName: displayName.trim() || cleanUser,
              password: password,
              avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              role: cleanUser === 'Noah_' ? 'admin' : 'member',
              customStatus: cleanUser === 'Noah_' ? '⚓ Fleet Captain' : '⛵ Sailor'
            };

            setAccounts(prev => [...prev, newProfile]);
            setCurrentUser(newProfile);
            triggerToast(`Account created! Welcome @${cleanUser}!`);

          } else {
            const matchedAccount = accounts.find(a => a.username.toLowerCase() === cleanUser.toLowerCase());

            if (!matchedAccount) {
              throw new Error(`Account @${cleanUser} does not exist. Please Sign Up first!`);
            }

            if (matchedAccount.password && matchedAccount.password !== password) {
              throw new Error(`Incorrect password for @${cleanUser}!`);
            }

            if (supabase) {
              await supabase.auth.signInWithPassword({ email: email, password: password });
            }

            setCurrentUser(matchedAccount);
            triggerToast(`Welcome back, @${matchedAccount.username}!`);
          }
        } catch (err) {
          setErrorMsg(err.message || 'Authentication error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
          <div className="bg-[#0f172a]/90 border border-white/10 w-full max-w-md rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 glass-panel animate-fade-in mx-4">
            <div className="text-center space-y-2">
              <div className="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-xl shadow-sky-500/30">
                NC
              </div>
              <h2 className="text-xl md:text-2xl font-extrabold text-gray-100 tracking-tight">Welcome to NoahCord</h2>
              <p className="text-xs text-gray-400">Join the official <span className="text-sky-400 font-semibold">Sailors ⚓</span> fleet server</p>

            <div className="flex bg-[#1e293b] p-1 rounded-xl border border-white/10 text-xs font-semibold">

                    required

                    className="w-full bg-[#1e293b] border border-white/10 rounded-xl pl-8 pr-3 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-sky-500"

            </div>
          </div>
        </div>

              </div>

                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 border border-[#0f172a]" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-bold text-gray-200 truncate flex items-center gap-1">
                    {currentUser.displayName}
                    {currentUser.username === 'Noah_' && <Icon name="crown" size={12} className="text-amber-400" />}
                  </div>
                  <div className="text-[10px] text-gray-400 truncate">@{currentUser.username}</div>
                </div>
              </div>

              <button onClick={logout} className="p-1.5 text-gray-400 hover:text-rose-400 hover:bg-[#1e293b] rounded-lg transition" title="Log Out">
                <Icon name="logout" size={16} />
              </button>
            </div>
          )}
        </div>
      );
    };

    // --- Chat Window Component ---
    const ChatWindow = () => {
      const { categories, activeChannelId, messages, sendMessage, rightSidebarOpen, setRightSidebarOpen, setMobileMenuOpen } = useApp();
      const [input, setInput] = useState('');
      const [showGiphy, setShowGiphy] = useState(false);
      const chatEndRef = useRef(null);

      let activeChan = null;
      categories.forEach(cat => {
        const found = cat.channels.find(c => c.id === activeChannelId);
        if (found) activeChan = found;
      });
      if (!activeChan) activeChan = categories[0].channels[0];

      const chanMessages = messages[activeChan?.id] || [];

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chanMessages.length]);

      const handleSend = (e) => {
        e?.preventDefault();
        if (!input.trim()) return;

        if (input.startsWith('/poll')) {
          const parts = input.replace('/poll', '').split('|').map(s => s.trim()).filter(Boolean);
          sendMessage(activeChan.id, `📊 **POLL:** ${parts[0] || 'Poll'}`, { question: parts[0] || 'Poll', options: parts.slice(1) });
        } else if (input === '/shrug') {
          sendMessage(activeChan.id, '¯\\_(ツ)_/¯');
        } else if (input === '/tableflip') {
          sendMessage(activeChan.id, '(╯°□°)╯︵ ┻━┻');
        } else {
          sendMessage(activeChan.id, input);
        }
        setInput('');
      };

      return (
        <div className="flex-1 flex flex-col h-full bg-[#080b12] relative overflow-hidden w-full">

                  return (
                    <div key={msg.id} className="group relative flex items-start gap-3 hover:bg-white/[0.02] px-2 md:px-3 py-[1px] my-[1px] rounded-lg transition duration-150">

                  <div className="text-[10px] text-gray-400 truncate">@{usr.username}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- Profile Modal ---
    const ProfileModal = () => {
      const { isProfileModalOpen, setIsProfileModalOpen, currentUser, updateProfile, theme, setTheme } = useApp();
      
      const [displayName, setDisplayName] = useState(currentUser?.displayName || '');
      const [username, setUsername] = useState(currentUser?.username || '');
      const [bio, setBio] = useState(currentUser?.bio || '');
      const [pronouns, setPronouns] = useState(currentUser?.pronouns || '');
      const [avatar, setAvatar] = useState(currentUser?.avatar || '');
      const [banner, setBanner] = useState(currentUser?.banner || '');
      const [customStatus, setCustomStatus] = useState(currentUser?.customStatus || '');
      const [status, setStatus] = useState(currentUser?.status || 'online');

      useEffect(() => {
        if (currentUser) {
          setDisplayName(currentUser.displayName || '');
          setUsername(currentUser.username || '');
          setBio(currentUser.bio || '');
          setPronouns(currentUser.pronouns || '');
          setAvatar(currentUser.avatar || '');
          setBanner(currentUser.banner || '');
          setCustomStatus(currentUser.customStatus || '');
          setStatus(currentUser.status || 'online');
        }
      }, [currentUser]);

      if (!isProfileModalOpen || !currentUser) return null;

      const handleSave = (e) => {
        e.preventDefault();
        updateProfile({ displayName, username, bio, pronouns, avatar, banner, customStatus, status });
        setIsProfileModalOpen(false);
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-[#0f172a] border border-white/10 w-full max-w-xl rounded-3xl overflow-hidden shadow-2xl glass-panel flex flex-col max-h-[90vh] mx-2">
            
            <div className="h-24 md:h-28 relative bg-gradient-to-r from-sky-500 to-indigo-600 shrink-0">
              {banner && <img src={banner} className="w-full h-full object-cover" alt="" />}
              <button onClick={() => setIsProfileModalOpen(false)} className="absolute top-3 right-3 p-1.5 rounded-full bg-black/40 text-white hover:bg-black/60"><Icon name="x" size={18} /></button>
            </div>

            <div className="px-6 relative -mt-8 mb-2 flex justify-between items-end shrink-0">
              <div className="relative">
                <img src={avatar} className="w-16 h-16 md:w-20 md:h-20 rounded-2xl object-cover ring-4 ring-[#0f172a] shadow-xl" alt="" />
                <span className="absolute bottom-1 right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-[#0f172a]" />
              </div>
              <div className="text-right">
                <h3 className="font-bold text-gray-100 text-base md:text-lg">{displayName}</h3>
                <p className="text-xs text-gray-400">@{username}</p>
              </div>
            </div>

            <form onSubmit={handleSave} className="p-4 md:p-6 overflow-y-auto space-y-4 flex-1">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-gray-400">Display Name</label>
                  <input type="text" value={displayName} onChange={(e) => setDisplayName(e.target.value)} className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-gray-400">Username</label>
                  <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-gray-400">Pronouns</label>
                  <input type="text" value={pronouns} onChange={(e) => setPronouns(e.target.value)} placeholder="he/him, she/her, they/them" className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-gray-400">Status Type</label>
                  <select value={status} onChange={(e) => setStatus(e.target.value)} className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100">
                    <option value="online">Online</option>
                    <option value="idle">Idle</option>
                    <option value="dnd">Do Not Disturb</option>
                    <option value="offline">Invisible</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400">Custom Status Tag</label>
                <input type="text" value={customStatus} onChange={(e) => setCustomStatus(e.target.value)} placeholder="🚀 Cruising NoahCord" className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400">Avatar Image URL</label>
                <input type="text" value={avatar} onChange={(e) => setAvatar(e.target.value)} className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400">Bio</label>
                <textarea rows="2" value={bio} onChange={(e) => setBio(e.target.value)} className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-100" />
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400 mb-2 block">App Theme Preset</label>
                <div className="grid grid-cols-3 gap-2">
                  {['midnight', 'black', 'dark-blue', 'cyan-neon', 'pink'].map(t => (
                    <button type="button" key={t} onClick={() => setTheme(t)} className={`p-2 rounded-xl border text-xs capitalize text-center ${theme === t ? 'border-sky-500 bg-sky-500/20 font-bold' : 'border-white/10'}`}>
                      {t}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button type="button" onClick={() => setIsProfileModalOpen(false)} className="px-4 py-2 rounded-xl bg-[#1e293b] text-gray-300 text-xs">Cancel</button>
                <button type="submit" className="px-6 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold shadow-lg">Save Profile Changes</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // --- Noah_ Admin Panel ---
    const AdminPanelModal = () => {
      const { isAdminModalOpen, setIsAdminModalOpen, categories, addChannel, currentUser } = useApp();
      const [catName, setCatName] = useState('Deck Operations');
      const [chanName, setChanName] = useState('');

      if (!isAdminModalOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#0f172a] border border-sky-500/40 w-full max-w-xl rounded-3xl p-6 shadow-2xl space-y-6 glass-panel mx-2">
            <div className="flex items-center justify-between pb-4 border-b border-white/10">
              <div className="flex items-center gap-2">
                <Icon name="crown" size={20} className="text-amber-400" />
                <h2 className="font-extrabold text-base md:text-lg text-gray-100">Sailors Admin Panel (@{currentUser?.username})</h2>
              </div>
              <button onClick={() => setIsAdminModalOpen(false)} className="text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); if (chanName) { addChannel(catName, chanName); setChanName(''); } }} className="space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                <select value={catName} onChange={(e) => setCatName(e.target.value)} className="bg-[#1e293b] border border-white/10 rounded-xl p-2 text-xs text-gray-100">
                  {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                </select>
                <input
                  type="text"
                  placeholder="channel-name"
                  value={chanName}
                  onChange={(e) => setChanName(e.target.value)}
                  className="bg-[#1e293b] border border-white/10 rounded-xl p-2 text-xs text-gray-100"
                />
              </div>
              <button type="submit" className="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold text-xs py-2 rounded-xl">+ Add Channel</button>
            </form>
          </div>
        </div>
      );
    };

    // --- Main App Root ---
    const MainApp = () => {
      const { currentUser, toastMsg, mobileMenuOpen, setMobileMenuOpen, rightSidebarOpen, setRightSidebarOpen } = useApp();

      return (
        <div className="flex h-screen h-[100dvh] w-screen overflow-hidden bg-[#080b12] text-gray-100 relative">
          {toastMsg && (
            <div className="absolute top-4 right-4 bg-sky-500 text-white px-4 py-2 rounded-2xl shadow-2xl z-50 text-xs font-bold border border-white/20">
              <Icon name="sparkles" size={16} /> {toastMsg}
            </div>
          )}

          {!currentUser ? (
            <AuthModal />
          ) : (
            <>
              {/* Mobile Left Drawer Backdrop */}
              {mobileMenuOpen && (
                <div 
                  onClick={() => setMobileMenuOpen(false)} 
                  className="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 md:hidden animate-fade-in"
                />
              )}

              {/* Combined Left Sidebars */}
              <div className={`fixed inset-y-0 left-0 z-40 flex h-full transition-transform duration-300 md:relative md:translate-x-0 ${
                mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full md:translate-x-0'
              }`}>
                <ServerSidebar />
                <ChannelListSidebar />
              </div>

              {/* Main Workspace */}
              <div className="flex-1 flex h-full overflow-hidden w-full">
                <ChatWindow />

                {/* Mobile Right Sidebar Backdrop */}
                {rightSidebarOpen && (
                  <div 
                    onClick={() => setRightSidebarOpen(false)} 
                    className="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 md:hidden animate-fade-in"
                  />
                )}

                {/* Right Member Sidebar */}
                <div className={`fixed inset-y-0 right-0 z-40 h-full transition-transform duration-300 md:relative md:translate-x-0 ${
                  rightSidebarOpen ? 'translate-x-0 shadow-2xl' : 'translate-x-full md:hidden'
                }`}>
                  <RightSidebar />
                </div>
              </div>

              <AdminPanelModal />
              <ProfileModal />
            </>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <MainApp />
      </AppProvider>
    );
  </script>
</body>
</html>
