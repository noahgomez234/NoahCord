
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoahCord — Premium Web Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: 'var(--color-accent, #0ea5e9)',
              600: '#0284c7',
              900: '#0c4a6e',
            },
            dark: {
              bg: 'var(--color-bg, #080b12)',
              surface: 'var(--color-surface, #0f172a)',
              panel: 'var(--color-panel, #1e293b)',
              border: 'var(--color-border, rgba(255, 255, 255, 0.08))',
              accent: 'var(--color-accent, #0ea5e9)',
            }
          },
          animation: {
            'bounce-subtle': 'bounce 2s infinite',
            'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-left': 'slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.98)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideLeft: {
              '0%': { opacity: '0', transform: 'translateX(20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM, Babel, Supabase -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --color-bg: #070a12;
      --color-surface: #0f172a;
      --color-panel: #1e293b;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-accent: #0ea5e9;
      --color-text: #f8fafc;
    }

    [data-theme="midnight"] {
      --color-bg: #050811;
      --color-surface: #0e1626;
      --color-panel: #1a2436;
      --color-border: rgba(56, 189, 248, 0.12);
      --color-accent: #38bdf8;
    }

    [data-theme="black"] {
      --color-bg: #000000;
      --color-surface: #0a0a0c;
      --color-panel: #141417;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-accent: #22d3ee;
    }

    [data-theme="dark-blue"] {
      --color-bg: #080e21;
      --color-surface: #0f1936;
      --color-panel: #1a284e;
      --color-border: rgba(96, 165, 250, 0.15);
      --color-accent: #60a5fa;
    }

    [data-theme="cyan-neon"] {
      --color-bg: #021415;
      --color-surface: #042425;
      --color-panel: #073a3c;
      --color-border: rgba(45, 212, 191, 0.2);
      --color-accent: #2dd4bf;
    }

    [data-theme="pink"] {
      --color-bg: #14050b;
      --color-surface: #240a14;
      --color-panel: #381020;
      --color-border: rgba(244, 63, 94, 0.2);
      --color-accent: #f43f5e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow: hidden;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
    }

    .glow-accent {
      box-shadow: 0 0 24px -4px var(--color-accent);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
  </style>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      var errDiv = document.getElementById('fatal-error');
      if (errDiv) {
        errDiv.style.display = 'block';
        errDiv.innerHTML = '<div style="padding:20px; background:#090d16; color:#f87171; font-family:monospace; z-index:9999; position:fixed; inset:0;">' +
          '<h2>NoahCord Handled Exception</h2>' +
          '<p>' + msg + '</p>' +
          '<p>Line: ' + line + ' | Col: ' + col + '</p>' +
          '<button onclick="location.reload()" style="background:#0ea5e9;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:12px;">Reload Application</button>' +
          '</div>';
      }
      return false;
    };
  </script>
</head>
<body class="bg-[#080b12] text-gray-100 min-h-screen">
  <div id="fatal-error" style="display:none;"></div>
  
  <div id="root">
    <div class="flex flex-col items-center justify-center h-screen bg-[#080b12] text-white">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-2xl animate-pulse mb-4 shadow-xl shadow-sky-500/30">
        NC
      </div>
      <p class="text-gray-400 font-medium text-sm animate-pulse">Loading NoahCord Experience...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- Supabase Configuration ---
    const SUPABASE_URL = "https://hcmglicybaitjqwkqice.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbWdsaWN5YmFpdGpxd2txaWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk5OTk5OTksImV4cCI6MjAxNTU1NTU1OX0.placeholder";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // --- Icon Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        hash: <path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18" />,
        message: <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />,
        users: <g><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm14 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" /></g>,
        bell: <g><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" /></g>,
        settings: <path d="M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />,
        search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        send: <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />,
        trash: <g><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" /></g>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        sparkles: <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z" />,
        crown: <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z" />,
        x: <g><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></g>,
        user: <g><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></g>,
        logout: <g><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></g>,
        pin: <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z" />,
        paperclip: <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />,
        volume2: <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" /></g>,
        mic: <g><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" /><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" /></g>,
        micOff: <g><line x1="1" y1="1" x2="23" y2="23" /><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6" /><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8" /></g>,
        sidebar: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="9" y1="3" x2="9" y2="21" /></g>,
        chevronDown: <polyline points="6 9 12 15 18 9" />,
        chevronRight: <polyline points="9 18 15 12 9 6" />,
        compass: <g><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></g>,
      };

      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || icons['hash']}
        </svg>
      );
    };

    // --- Seed Accounts & Data ---
    const SEED_ACCOUNTS = [
      { id: 'usr-noah', username: 'Noah_', displayName: 'Noah_ (Fleet Admin)', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200', password: 'admin123', role: 'admin', customStatus: '⚓ Fleet Captain' },
      { id: 'usr-alex', username: 'alex_sailor', displayName: 'Alex Mercer', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200', password: 'sailor123', role: 'member', customStatus: '⛵ Cruising general' }
    ];

    const INITIAL_CATEGORIES = [
      {
        id: 'cat-text',
        name: 'Deck Operations',
        channels: [
          { id: 'chan-announcements', name: 'announcements', type: 'announcement', desc: 'Official updates from Noah_ & Fleet Command' },
          { id: 'chan-general', name: 'general', type: 'text', desc: 'Main deck chat for all Sailors' },
          { id: 'chan-lounge', name: 'lounge', type: 'text', desc: 'Relax and share stories from the seas' }
        ]
      },
      {
        id: 'cat-voice',
        name: 'Voice Decks',
        channels: [
          { id: 'chan-bridge', name: 'Captain Deck', type: 'voice', desc: 'Voice room for fleet leaders' }
        ]
      }
    ];

    const INITIAL_MESSAGES = {
      'chan-general': [
        { id: 'm1', senderId: 'usr-noah', senderName: 'Noah_', senderAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200', content: 'Welcome to **Sailors** ⚓! Everyone is automatically onboarded here.', timestamp: '12:00 PM' },
        { id: 'm2', senderId: 'usr-noah', senderName: 'Noah_', senderAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200', content: 'Notice how consecutive messages from the same sender are grouped tightly together!', timestamp: '12:01 PM' }
      ]
    };

    // --- Context & State Provider ---
    const AppContext = createContext(null);

    const AppProvider = ({ children }) => {
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('noahcord_accounts');
        return saved ? JSON.parse(saved) : SEED_ACCOUNTS;
      });

      // No default login! Users start unauthenticated (null)
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('noahcord_active_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [theme, setTheme] = useState(() => localStorage.getItem('noahcord_theme') || 'midnight');
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('noahcord_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });

      const [activeChannelId, setActiveChannelId] = useState('chan-general');
      const [messages, setMessages] = useState(INITIAL_MESSAGES);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [rightSidebarOpen, setRightSidebarOpen] = useState(true);
      const [logoClickCount, setLogoClickCount] = useState(0);
      const [toastMsg, setToastMsg] = useState(null);
      const [activeVoiceCall, setActiveVoiceCall] = useState(null);

      useEffect(() => {
        localStorage.setItem('noahcord_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        if (currentUser) localStorage.setItem('noahcord_active_user', JSON.stringify(currentUser));
        else localStorage.removeItem('noahcord_active_user');
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('noahcord_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('noahcord_theme', theme);
      }, [theme]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Noah_ 10-Click Admin Easter Egg
      const handleLogoClick = () => {
        if (!currentUser) return;
        const newCount = logoClickCount + 1;
        setLogoClickCount(newCount);

        if (newCount < 10) {
          triggerToast(`System Override: ${newCount}/10 Clicks`);
        } else {
          setLogoClickCount(0);
          if (currentUser.username === 'Noah_') {
            setIsAdminModalOpen(true);
            triggerToast('🔓 Fleet Command Admin Unlocked!');
          } else {
            triggerToast('⛔ Access Denied! Security Clearance requires username: Noah_');
          }
        }
      };

      const logout = () => {
        setCurrentUser(null);
        triggerToast('Logged out successfully.');
      };

      const sendMessage = (channelId, text, pollData = null) => {
        if (!currentUser) return;
        const newMsg = {
          id: 'msg-' + Date.now(),
          senderId: currentUser.id,
          senderName: currentUser.displayName,
          senderAvatar: currentUser.avatar,
          content: text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          poll: pollData
        };

        setMessages(prev => ({
          ...prev,
          [channelId]: [...(prev[channelId] || []), newMsg]
        }));
      };

      const addChannel = (categoryName, channelName, desc = '') => {
        const formatted = channelName.toLowerCase().replace(/\s+/g, '-');
        const newChan = { id: 'chan-' + Date.now(), name: formatted, type: 'text', desc };

        setCategories(prev => prev.map(cat => {
          if (cat.name.toLowerCase() === categoryName.toLowerCase()) {
            return { ...cat, channels: [...cat.channels, newChan] };
          }
          return cat;
        }));
        triggerToast(`Channel #${formatted} created!`);
      };

      const deleteChannel = (channelId) => {
        setCategories(prev => prev.map(cat => ({
          ...cat,
          channels: cat.channels.filter(c => c.id !== channelId)
        })));
        triggerToast('Channel deleted.');
      };

      return (
        <AppContext.Provider value={{
          accounts, setAccounts,
          currentUser, setCurrentUser, logout,
          theme, setTheme,
          categories, setCategories, addChannel, deleteChannel,
          activeChannelId, setActiveChannelId,
          messages, sendMessage,
          isAdminModalOpen, setIsAdminModalOpen,
          isSettingsOpen, setIsSettingsOpen,
          rightSidebarOpen, setRightSidebarOpen,
          activeVoiceCall, setActiveVoiceCall,
          handleLogoClick, logoClickCount,
          toastMsg, triggerToast
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- Component: Sign Up / Login Screen ---
    const AuthModal = () => {
      const { accounts, setAccounts, setCurrentUser, triggerToast } = useApp();
      const [isSignUp, setIsSignUp] = useState(true);
      const [username, setUsername] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const cleanUsername = username.trim();
      const isTaken = accounts.some(a => a.username.toLowerCase() === cleanUsername.toLowerCase());
      const isAvailable = cleanUsername.length >= 3 && !isTaken;

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (isSignUp) {
          if (cleanUsername.length < 3) return setErrorMsg('Username must be at least 3 characters.');
          if (isTaken) return setErrorMsg(`Username @${cleanUsername} is taken!`);
          if (password.length < 4) return setErrorMsg('Password must be at least 4 characters.');

          const newUser = {
            id: 'usr-' + Date.now(),
            username: cleanUsername,
            displayName: displayName.trim() || cleanUsername,
            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
            password: password,
            role: cleanUsername === 'Noah_' ? 'admin' : 'member',
            customStatus: cleanUsername === 'Noah_' ? '⚓ Fleet Captain' : '⛵ Sailor'
          };

          setAccounts(prev => [...prev, newUser]);
          setCurrentUser(newUser);
          triggerToast(`Welcome to Sailors ⚓, @${cleanUsername}!`);
        } else {
          const existing = accounts.find(a => a.username.toLowerCase() === cleanUsername.toLowerCase());
          if (!existing) return setErrorMsg(`Account @${cleanUsername} not found.`);
          if (existing.password !== password) return setErrorMsg('Incorrect password!');

          setCurrentUser(existing);
          triggerToast(`Welcome back, @${existing.username}!`);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
          <div className="bg-[#0f172a]/90 border border-white/10 w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6 glass-panel animate-fade-in">
            <div className="text-center space-y-2">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-xl shadow-sky-500/30">
                NC
              </div>
              <h2 className="text-2xl font-extrabold text-gray-100 tracking-tight">Welcome to NoahCord</h2>
              <p className="text-xs text-gray-400">Join the official <span className="text-sky-400 font-semibold">Sailors ⚓</span> fleet server</p>
            </div>

            <div className="flex bg-[#1e293b] p-1 rounded-xl border border-white/10 text-xs font-semibold">
              <button
                type="button"
                onClick={() => { setIsSignUp(true); setErrorMsg(''); }}
                className={`flex-1 py-2 rounded-lg transition ${isSignUp ? 'bg-sky-500 text-white' : 'text-gray-400 hover:text-white'}`}
              >
                Sign Up
              </button>
              <button
                type="button"
                onClick={() => { setIsSignUp(false); setErrorMsg(''); }}
                className={`flex-1 py-2 rounded-lg transition ${!isSignUp ? 'bg-sky-500 text-white' : 'text-gray-400 hover:text-white'}`}
              >
                Log In
              </button>
            </div>

            {errorMsg && (
              <div className="bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl font-medium">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-gray-400 flex justify-between">
                  <span>Username</span>
                  {isSignUp && cleanUsername && (
                    <span className={`text-[11px] ${isAvailable ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {isAvailable ? '✓ Available' : '✗ Taken'}
                    </span>
                  )}
                </label>
                <div className="relative mt-1">
                  <span className="absolute left-3 top-2.5 text-gray-500 text-sm">@</span>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="e.g. Noah_ or sailor_jack"
                    className="w-full bg-[#1e293b] border border-white/10 rounded-xl pl-8 pr-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-sky-500"
                  />
                </div>
              </div>

              {isSignUp && (
                <div>
                  <label className="text-xs font-semibold text-gray-400">Display Name</label>
                  <input
                    type="text"
                    value={displayName}
                    onChange={(e) => setDisplayName(e.target.value)}
                    placeholder="e.g. Captain Jack"
                    className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-sky-500"
                  />
                </div>
              )}

              <div>
                <label className="text-xs font-semibold text-gray-400">Password</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full mt-1 bg-[#1e293b] border border-white/10 rounded-xl px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-sky-500"
                />
              </div>

              <button
                type="submit"
                className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm py-3 rounded-xl transition shadow-lg mt-2"
              >
                {isSignUp ? 'Create Account & Join Sailors ⚓' : 'Log In & Enter Sailors ⚓'}
              </button>
            </form>

            <div className="text-center text-[11px] text-gray-500">
              Admin clearance: Sign up as username <span className="text-sky-400 font-mono font-bold">Noah_</span>
            </div>
          </div>
        </div>
      );
    };

    // --- Component: Primary Left Server Navigation Bar ---
    const ServerSidebar = () => {
      const { handleLogoClick, setIsSettingsOpen } = useApp();

      return (
        <div className="w-18 md:w-20 bg-[#0f172a]/90 border-r border-white/10 flex flex-col items-center py-4 justify-between select-none z-20 glass-panel">
          <div className="flex flex-col items-center gap-4 w-full">
            <div 
              onClick={handleLogoClick}
              className="relative group cursor-pointer"
              title="Click 10x for Noah_ Fleet Admin Panel"
            >
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-xl shadow-sky-500/20 group-hover:scale-105 transition-all duration-300">
                <span className="font-black text-xl tracking-tighter">NC</span>
              </div>
            </div>

            <div className="w-8 h-[1px] bg-white/10" />

            <button className="relative group w-12 h-12 rounded-2xl flex items-center justify-center bg-sky-500 text-white shadow-lg scale-105">
              <span className="text-xl">⚓</span>
            </button>
          </div>

          <button
            onClick={() => setIsSettingsOpen(true)}
            className="p-3 text-gray-400 hover:text-white hover:bg-[#1e293b] rounded-2xl transition"
            title="Settings & Themes"
          >
            <Icon name="settings" size={20} />
          </button>
        </div>
      );
    };

    // --- Component: Channels Navigation Sidebar ---
    const ChannelListSidebar = () => {
      const { categories, activeChannelId, setActiveChannelId, currentUser, setIsAdminModalOpen, setActiveVoiceCall, activeVoiceCall, logout } = useApp();
      const [collapsedCat, setCollapsedCat] = useState({});

      const toggleCategory = (catId) => {
        setCollapsedCat(prev => ({ ...prev, [catId]: !prev[catId] }));
      };

      return (
        <div className="w-60 md:w-64 bg-[#0f172a]/80 border-r border-white/10 flex flex-col h-full select-none glass-panel">
          <div className="h-16 px-4 border-b border-white/10 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-2">
              <span className="text-2xl">⚓</span>
              <div>
                <h2 className="font-extrabold text-sm text-gray-100 tracking-wide flex items-center gap-1">
                  Sailors
                  <Icon name="shield" size={14} className="text-sky-400" />
                </h2>
                <p className="text-[10px] text-gray-400">Main Community Fleet</p>
              </div>
            </div>

            {currentUser?.username === 'Noah_' && (
              <button 
                onClick={() => setIsAdminModalOpen(true)} 
                className="p-1.5 rounded-lg bg-sky-500/10 text-sky-400 hover:bg-sky-500 hover:text-white transition"
                title="Noah_ Admin Panel"
              >
                <Icon name="crown" size={16} />
              </button>
            )}
          </div>

          <div className="flex-1 overflow-y-auto p-3 space-y-4">
            {categories.map(cat => (
              <div key={cat.id}>
                <div 
                  onClick={() => toggleCategory(cat.id)}
                  className="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-2 mb-1 flex items-center justify-between cursor-pointer hover:text-gray-200"
                >
                  <span className="flex items-center gap-1">
                    <Icon name={collapsedCat[cat.id] ? 'chevronRight' : 'chevronDown'} size={12} />
                    {cat.name}
                  </span>
                  <span className="text-[10px] bg-[#1e293b] px-1.5 py-0.5 rounded">{cat.channels.length}</span>
                </div>

                {!collapsedCat[cat.id] && (
                  <div className="space-y-1">
                    {cat.channels.map(chan => {
                      const isVoice = chan.type === 'voice';
                      const isActive = activeChannelId === chan.id;

                      return (
                        <button
                          key={chan.id}
                          onClick={() => {
                            setActiveChannelId(chan.id);
                            if (isVoice) {
                              setActiveVoiceCall({ channelName: chan.name, muted: false, deafened: false });
                            }
                          }}
                          className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-left text-sm transition ${
                            isActive 
                              ? 'bg-sky-500/20 text-white font-semibold border border-sky-500/30' 
                              : 'text-gray-400 hover:bg-[#1e293b]/60 hover:text-gray-200'
                          }`}
                        >
                          <div className="flex items-center gap-2 min-w-0">
                            <Icon name={isVoice ? 'volume2' : 'hash'} size={16} className={isActive ? 'text-sky-400' : 'text-gray-500'} />
                            <span className="truncate">{chan.name}</span>
                          </div>
                          {isVoice && <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-full font-bold">Voice</span>}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Active Voice Bar */}
          {activeVoiceCall && (
            <div className="p-3 bg-emerald-950/40 border-t border-emerald-500/30 text-xs space-y-2">
              <div className="flex items-center justify-between text-emerald-400 font-semibold">
                <span className="flex items-center gap-1.5"><Icon name="volume2" size={14} /> Connected: {activeVoiceCall.channelName}</span>
                <button onClick={() => setActiveVoiceCall(null)} className="hover:text-white"><Icon name="x" size={14} /></button>
              </div>
            </div>
          )}

          {/* Bottom Logged In User Profile Banner */}
          {currentUser && (
            <div className="p-3 bg-[#0f172a] border-t border-white/10 flex items-center justify-between">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="relative">
                  <img src={currentUser.avatar} className="w-8 h-8 rounded-xl object-cover ring-1 ring-white/10" alt="" />
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 border border-[#0f172a]" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-bold text-gray-200 truncate flex items-center gap-1">
                    {currentUser.displayName}
                    {currentUser.username === 'Noah_' && <Icon name="crown" size={12} className="text-amber-400" />}
                  </div>
                  <div className="text-[10px] text-gray-400 truncate">@{currentUser.username}</div>
                </div>
              </div>

              <button
                onClick={logout}
                className="p-1.5 text-gray-400 hover:text-rose-400 hover:bg-[#1e293b] rounded-lg transition"
                title="Log Out"
              >
                <Icon name="logout" size={16} />
              </button>
            </div>
          )}
        </div>
      );
    };

    // --- Component: Main Chat Window (Compact Consecutive Messages) ---
    const ChatWindow = () => {
      const { categories, activeChannelId, messages, sendMessage, rightSidebarOpen, setRightSidebarOpen } = useApp();
      const [input, setInput] = useState('');
      const [showSlashMenu, setShowSlashMenu] = useState(false);
      const chatEndRef = useRef(null);

      let activeChan = null;
      categories.forEach(cat => {
        const found = cat.channels.find(c => c.id === activeChannelId);
        if (found) activeChan = found;
      });
      if (!activeChan) activeChan = categories[0].channels[0];

      const chanMessages = messages[activeChan?.id] || [];

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chanMessages.length]);

      const handleSend = (e) => {
        e?.preventDefault();
        if (!input.trim()) return;

        if (input.startsWith('/poll')) {
          const parts = input.replace('/poll', '').split('|').map(s => s.trim()).filter(Boolean);
          const question = parts[0] || 'Community Poll';
          const options = parts.slice(1).length > 0 ? parts.slice(1) : ['Option A', 'Option B'];
          sendMessage(activeChan.id, `📊 **POLL:** ${question}`, { question, options });
        } else {
          sendMessage(activeChan.id, input);
        }

        setInput('');
        setShowSlashMenu(false);
      };

      return (
        <div className="flex-1 flex flex-col h-full bg-[#080b12] relative overflow-hidden">
          <div className="h-16 border-b border-white/10 px-6 flex items-center justify-between bg-[#0f172a]/40 backdrop-blur-md">
            <div className="flex items-center gap-2">
              <Icon name={activeChan?.type === 'voice' ? 'volume2' : 'hash'} className="text-sky-400" size={22} />
              <div>
                <h3 className="font-bold text-gray-100 text-sm">{activeChan?.name}</h3>
                <p className="text-xs text-gray-400">{activeChan?.desc}</p>
              </div>
            </div>

            <button 
              onClick={() => setRightSidebarOpen(!rightSidebarOpen)}
              className={`p-2 rounded-xl transition ${rightSidebarOpen ? 'bg-sky-500/20 text-sky-400' : 'text-gray-400 hover:text-white'}`}
            >
              <Icon name="sidebar" size={18} />
            </button>
          </div>

          {/* Compact Grouped Message Stream */}
          <div className="flex-1 overflow-y-auto p-6 space-y-1">
            {chanMessages.map((msg, idx) => {
              const prevMsg = chanMessages[idx - 1];
              const isGrouped = prevMsg && prevMsg.senderId === msg.senderId;

              return (
                <div key={msg.id} className={`group relative flex gap-3 hover:bg-[#1e293b]/30 px-3 py-1 rounded-xl transition duration-150 ${isGrouped ? 'mt-0.5' : 'mt-3.5'}`}>
                  {!isGrouped ? (
                    <img src={msg.senderAvatar} className="w-9 h-9 rounded-xl object-cover ring-1 ring-white/10" alt="" />
                  ) : (
                    <div className="w-9 text-[10px] text-gray-600 text-right pr-2 opacity-0 group-hover:opacity-100 select-none pt-0.5">
                      {msg.timestamp}
                    </div>
                  )}

                  <div className="flex-1 min-w-0">
                    {!isGrouped && (
                      <div className="flex items-center gap-2 mb-0.5">
                        <span className="font-bold text-xs text-gray-200">{msg.senderName}</span>
                        {msg.senderName.includes('Noah_') && <span className="bg-sky-500/20 text-sky-400 text-[10px] px-1.5 py-0.2 rounded font-semibold">Fleet Admin</span>}
                        <span className="text-[10px] text-gray-500">{msg.timestamp}</span>
                      </div>
                    )}

                    <div className="text-xs text-gray-300 leading-snug break-words">{msg.content}</div>

                    {msg.poll && (
                      <div className="mt-2 bg-[#0f172a] border border-white/10 p-3 rounded-xl max-w-sm space-y-1">
                        <div className="font-bold text-xs text-sky-400">POLL: {msg.poll.question}</div>
                        {msg.poll.options.map((opt, i) => (
                          <button key={i} className="w-full text-left text-xs bg-[#1e293b] p-1.5 rounded-lg border border-white/5 flex justify-between">
                            <span>{opt}</span>
                            <span className="text-gray-500 font-mono">0 votes</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            <div ref={chatEndRef} />
          </div>

          <div className="p-4 bg-[#0f172a]/40 backdrop-blur-md border-t border-white/10">
            <form onSubmit={handleSend} className="flex items-center bg-[#0f172a] border border-white/10 rounded-2xl p-2 focus-within:border-sky-500 transition shadow-inner">
              <input
                type="text"
                value={input}
                onChange={(e) => {
                  setInput(e.target.value);
                  setShowSlashMenu(e.target.value.startsWith('/'));
                }}
                placeholder={`Message #${activeChan?.name} in Sailors...`}
                className="flex-1 bg-transparent px-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none"
              />
              <button
                type="submit"
                disabled={!input.trim()}
                className="p-2.5 rounded-xl bg-sky-500 hover:bg-sky-600 disabled:opacity-40 text-white transition shadow-md"
              >
                <Icon name="send" size={16} />
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- Component: Right Sidebar (Members List) ---
    const RightSidebar = () => {
      const { rightSidebarOpen, accounts } = useApp();

      if (!rightSidebarOpen) return null;

      return (
        <div className="w-60 bg-[#0f172a]/80 border-l border-white/10 flex flex-col h-full select-none glass-panel p-4 space-y-4">
          <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Fleet Crew — {accounts.length}</div>
          <div className="space-y-2 overflow-y-auto">
            {accounts.map(usr => (
              <div key={usr.id} className="p-2 bg-[#1e293b]/40 border border-white/5 rounded-2xl flex items-center gap-2.5">
                <div className="relative">
                  <img src={usr.avatar} className="w-8 h-8 rounded-xl object-cover" alt="" />
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 border border-[#0f172a]" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-bold text-gray-200 truncate flex items-center gap-1">
                    {usr.displayName}
                    {usr.username === 'Noah_' && <Icon name="crown" size={12} className="text-amber-400" />}
                  </div>
                  <div className="text-[10px] text-gray-400 truncate">@{usr.username}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- Component: Admin Panel Modal (Noah_ Only) ---
    const AdminPanelModal = () => {
      const { isAdminModalOpen, setIsAdminModalOpen, categories, addChannel, deleteChannel, currentUser } = useApp();
      const [catName, setCatName] = useState('Deck Operations');
      const [chanName, setChanName] = useState('');

      if (!isAdminModalOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#0f172a] border border-sky-500/40 w-full max-w-xl rounded-3xl p-6 shadow-2xl space-y-6 glass-panel">
            <div className="flex items-center justify-between pb-4 border-b border-white/10">
              <div className="flex items-center gap-2">
                <Icon name="crown" size={20} className="text-amber-400" />
                <h2 className="font-extrabold text-lg text-gray-100">Sailors Admin Panel (@{currentUser?.username})</h2>
              </div>
              <button onClick={() => setIsAdminModalOpen(false)} className="text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); if (chanName) { addChannel(catName, chanName); setChanName(''); } }} className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <select value={catName} onChange={(e) => setCatName(e.target.value)} className="bg-[#1e293b] border border-white/10 rounded-xl p-2 text-xs text-gray-100">
                  {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                </select>
                <input
                  type="text"
                  placeholder="channel-name"
                  value={chanName}
                  onChange={(e) => setChanName(e.target.value)}
                  className="bg-[#1e293b] border border-white/10 rounded-xl p-2 text-xs text-gray-100"
                />
              </div>
              <button type="submit" className="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold text-xs py-2 rounded-xl">+ Add Channel</button>
            </form>
          </div>
        </div>
      );
    };

    // --- Settings Modal ---
    const SettingsModal = () => {
      const { isSettingsOpen, setIsSettingsOpen, theme, setTheme, triggerToast } = useApp();

      if (!isSettingsOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#0f172a] border border-white/10 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 glass-panel">
            <div className="flex items-center justify-between pb-2 border-b border-white/10">
              <h2 className="font-extrabold text-lg text-gray-100">Theme Selector</h2>
              <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {['midnight', 'black', 'dark-blue', 'cyan-neon', 'pink'].map(t => (
                <button
                  key={t}
                  onClick={() => { setTheme(t); triggerToast(`Theme: ${t}`); }}
                  className={`p-3 rounded-xl border capitalize text-xs text-left ${theme === t ? 'border-sky-500 bg-sky-500/10 font-bold' : 'border-white/10'}`}
                >
                  {t}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- Main Layout ---
    const MainApp = () => {
      const { currentUser, toastMsg } = useApp();

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#080b12] text-gray-100 relative">
          {toastMsg && (
            <div className="absolute top-4 right-4 bg-sky-500 text-white px-4 py-2 rounded-2xl shadow-2xl z-50 text-xs font-bold border border-white/20">
              <Icon name="sparkles" size={16} /> {toastMsg}
            </div>
          )}

          {!currentUser ? (
            <AuthModal />
          ) : (
            <>
              <ServerSidebar />
              <ChannelListSidebar />
              <div className="flex-1 flex h-full overflow-hidden">
                <ChatWindow />
                <RightSidebar />
              </div>
              <AdminPanelModal />
              <SettingsModal />
            </>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <MainApp />
      </AppProvider>
    );
  </script>
</body>
</html>
