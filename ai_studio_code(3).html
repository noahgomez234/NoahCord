<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoahCord — Next-Gen Chat Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
            },
            dark: {
              bg: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              panel: 'var(--color-panel)',
              border: 'var(--color-border)',
              accent: 'var(--color-accent)',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-subtle': 'bounce 2s infinite',
            'fade-in': 'fadeIn 0.2s ease-out forwards',
            'slide-up': 'slideUp 0.25s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts (Inter + JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM, Babel, Supabase JS -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --color-bg: #0b0f19;
      --color-surface: #111827;
      --color-panel: #1f2937;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-accent: #06b6d4;
      --color-accent-hover: #0891b2;
      --color-text: #f9fafb;
    }

    /* Themes dynamic definitions */
    [data-theme="midnight"] {
      --color-bg: #07090e;
      --color-surface: #0f172a;
      --color-panel: #1e293b;
      --color-border: rgba(56, 189, 248, 0.12);
      --color-accent: #38bdf8;
    }

    [data-theme="black"] {
      --color-bg: #000000;
      --color-surface: #09090b;
      --color-panel: #18181b;
      --color-border: rgba(255, 255, 255, 0.12);
      --color-accent: #22d3ee;
    }

    [data-theme="dark-blue"] {
      --color-bg: #0a1128;
      --color-surface: #101f42;
      --color-panel: #1c2d5a;
      --color-border: rgba(96, 165, 250, 0.15);
      --color-accent: #60a5fa;
    }

    [data-theme="cyan-neon"] {
      --color-bg: #021a1a;
      --color-surface: #042f2e;
      --color-panel: #064e3b;
      --color-border: rgba(45, 212, 191, 0.2);
      --color-accent: #2dd4bf;
    }

    [data-theme="heart-pink"] {
      --color-bg: #1f040d;
      --color-surface: #380718;
      --color-panel: #4c0519;
      --color-border: rgba(244, 63, 94, 0.2);
      --color-accent: #f43f5e;
    }

    [data-theme="rose"] {
      --color-bg: #18060c;
      --color-surface: #2a0a16;
      --color-panel: #3f1222;
      --color-border: rgba(251, 113, 133, 0.2);
      --color-accent: #fb7185;
    }

    [data-theme="white"] {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-panel: #f1f5f9;
      --color-border: rgba(0, 0, 0, 0.08);
      --color-accent: #0284c7;
      --color-text: #0f172a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow: hidden;
      user-select: none;
    }

    /* Glassmorphism utility */
    .glass {
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-border);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border: 1px solid var(--color-border);
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Custom Animations */
    .glow-accent {
      box-shadow: 0 0 20px -3px var(--color-accent);
    }

    .markdown-code {
      font-family: 'JetBrains Mono', monospace;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

    // --- SVG Icon Set Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        hash: <path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18" />,
        message: <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />,
        users: <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm14 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />,
        userPlus: <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm10-1h6m-3-3v6" />,
        bell: <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />,
        settings: <path d="M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />,
        search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        smile: <circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" />,
        image: <rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" />,
        sticker: <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 18a8 8 0 118-8 8 8 0 01-8 8z" /><path d="M15 9h.01M9 9h.01M9 14a3 3 0 006 0" />,
        gif: <rect x="3" y="5" width="18" height="14" rx="3" /><path d="M8 10H6v4h2v-2H7M12 10v4M15 10h3v1.5h-2v1H18V14h-3" />,
        send: <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />,
        pin: <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z" />,
        reply: <path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 015.5 5.5v2.5" />,
        trash: <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
        edit: <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />,
        check: <polyline points="20 6 9 17 4 12" />,
        x: <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />,
        database: <ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3M21 19c0 1.66-4 3-9 3s-9-1.34-9-3M3 5v14M21 5v14" />,
        logOut: <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        sparkles: <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z" />,
        plus: <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />,
        copy: <rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />,
        heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />,
        paperclip: <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || icons['hash']}
        </svg>
      );
    };

    // --- Mock Initial Database Engine ---
    const INITIAL_USERS = [
      { id: 'usr-1', username: 'alex', displayName: 'Alex Mercer', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', banner: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600', bio: 'Full-stack Architect & UI Enthusiast. Building the next gen web!', status: 'online', customStatus: '🚀 Building NoahCord', pronouns: 'they/them', accentColor: '#06b6d4', badges: ['Founder', 'Verified'] },
      { id: 'usr-2', username: 'sarah_sky', displayName: 'Sarah Connor', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', banner: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600', bio: 'AI researcher & Cybersec explorer.', status: 'online', customStatus: '☕ Need Coffee', pronouns: 'she/her', accentColor: '#f43f5e', badges: ['Early Supporter'] },
      { id: 'usr-3', username: 'neo_matrix', displayName: 'Thomas Anderson', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', banner: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600', bio: 'There is no spoon.', status: 'idle', customStatus: '🕶️ In the Matrix', pronouns: 'he/him', accentColor: '#10b981', badges: ['Cyber VIP'] },
      { id: 'usr-4', username: 'cyber_kai', displayName: 'Kai Vance', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', banner: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600', bio: 'Sound designer & Web3 pioneer.', status: 'dnd', customStatus: '🎧 Mixing tracks', pronouns: 'he/him', accentColor: '#8b5cf6', badges: ['Audio Lead'] }
    ];

    const INITIAL_GROUPS = [
      { id: 'grp-1', name: '⚡ Dev Nexus', icon: '💻', desc: 'Official developer ecosystem & updates.', adminId: 'usr-1', members: ['usr-1', 'usr-2', 'usr-3', 'usr-4'] },
      { id: 'grp-2', name: '🎨 UI/UX Design Lab', icon: '✨', desc: 'Crafting glassmorphism and modern UI components.', adminId: 'usr-2', members: ['usr-1', 'usr-2'] }
    ];

    const INITIAL_MESSAGES = {
      'grp-1': [
        { id: 'm1', senderId: 'usr-2', senderName: 'Sarah Connor', senderAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', content: 'Hey everyone! Welcome to **NoahCord**! Check out the smooth theme toggler in Settings.', timestamp: '10:14 AM', reactions: [{ emoji: '🔥', count: 3, users: ['usr-1', 'usr-3'] }] },
        { id: 'm2', senderId: 'usr-1', senderName: 'Alex Mercer', senderAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', content: 'Super excited to launch this! Try uploading an image or typing inline `code` blocks.', timestamp: '10:16 AM', isPinned: true, reactions: [{ emoji: '🚀', count: 4, users: ['usr-1', 'usr-2', 'usr-3', 'usr-4'] }] },
      ],
      'usr-2': [
        { id: 'dm1', senderId: 'usr-2', senderName: 'Sarah Connor', senderAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', content: 'Hey Alex! Got time to review the Supabase RLS migrations?', timestamp: 'Yesterday' }
      ]
    };

    const BUILTIN_STICKERS = [
      { id: 'stk-1', url: 'https://cdn-icons-png.flaticon.com/512/4712/4712035.png', name: 'Rocket Cyber' },
      { id: 'stk-2', url: 'https://cdn-icons-png.flaticon.com/512/4712/4712109.png', name: 'Cool Cat' },
      { id: 'stk-3', url: 'https://cdn-icons-png.flaticon.com/512/4712/4712038.png', name: 'Sparkle Heart' },
      { id: 'stk-4', url: 'https://cdn-icons-png.flaticon.com/512/4712/4712027.png', name: 'Party Neon' }
    ];

    // --- Main React Context ---
    const AppContext = createContext(null);

    const AppProvider = ({ children }) => {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('noahcord_user');
        return saved ? JSON.parse(saved) : INITIAL_USERS[0];
      });

      const [theme, setTheme] = useState(() => localStorage.getItem('noahcord_theme') || 'midnight');
      const [activeTab, setActiveTab] = useState('home'); // 'home', 'dm', 'group', 'friends', 'settings'
      const [activeChatId, setActiveChatId] = useState('grp-1'); // Can be user ID or group ID
      const [messages, setMessages] = useState(INITIAL_MESSAGES);
      const [friends, setFriends] = useState(INITIAL_USERS.slice(1));
      const [friendRequests, setFriendRequests] = useState([
        { id: 'req-1', from: { id: 'usr-3', displayName: 'Thomas Anderson', username: 'neo_matrix', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' } }
      ]);
      const [groups, setGroups] = useState(INITIAL_GROUPS);
      const [notifications, setNotifications] = useState([
        { id: 'n1', title: 'Welcome to NoahCord!', body: 'Your account is verified and ready to explore.', read: false, time: 'Just now' }
      ]);

      // Supabase Integration Config State
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
        const url = localStorage.getItem('noahcord_sb_url') || '';
        const key = localStorage.getItem('noahcord_sb_key') || '';
        return { url, key, connected: false };
      });

      // Apply theme CSS target
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('noahcord_theme', theme);
      }, [theme]);

      // Save user session
      useEffect(() => {
        localStorage.setItem('noahcord_user', JSON.stringify(currentUser));
      }, [currentUser]);

      const sendMessage = (chatId, text, attachment = null, sticker = null, gif = null, replyTo = null) => {
        const newMsg = {
          id: 'msg-' + Date.now(),
          senderId: currentUser.id,
          senderName: currentUser.displayName,
          senderAvatar: currentUser.avatar,
          content: text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          attachment,
          sticker,
          gif,
          replyTo,
          reactions: []
        };

        setMessages(prev => ({
          ...prev,
          [chatId]: [...(prev[chatId] || []), newMsg]
        }));
      };

      const toggleReaction = (chatId, messageId, emoji) => {
        setMessages(prev => {
          const chatMsgs = prev[chatId] || [];
          const updated = chatMsgs.map(msg => {
            if (msg.id !== messageId) return msg;
            let existingReactions = [...(msg.reactions || [])];
            const foundIdx = existingReactions.findIndex(r => r.emoji === emoji);
            if (foundIdx > -1) {
              const r = existingReactions[foundIdx];
              if (r.users.includes(currentUser.id)) {
                r.users = r.users.filter(u => u !== currentUser.id);
                r.count -= 1;
              } else {
                r.users.push(currentUser.id);
                r.count += 1;
              }
            } else {
              existingReactions.push({ emoji, count: 1, users: [currentUser.id] });
            }
            return { ...msg, reactions: existingReactions.filter(r => r.count > 0) };
          });
          return { ...prev, [chatId]: updated };
        });
      };

      const deleteMessage = (chatId, messageId) => {
        setMessages(prev => ({
          ...prev,
          [chatId]: (prev[chatId] || []).filter(m => m.id !== messageId)
        }));
      };

      const pinMessage = (chatId, messageId) => {
        setMessages(prev => ({
          ...prev,
          [chatId]: (prev[chatId] || []).map(m => m.id === messageId ? { ...m, isPinned: !m.isPinned } : m)
        }));
      };

      return (
        <AppContext.Provider value={{
          currentUser, setCurrentUser,
          theme, setTheme,
          activeTab, setActiveTab,
          activeChatId, setActiveChatId,
          messages, sendMessage, toggleReaction, deleteMessage, pinMessage,
          friends, setFriends,
          friendRequests, setFriendRequests,
          groups, setGroups,
          notifications, setNotifications,
          supabaseConfig, setSupabaseConfig
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- Component: Sidebar Navigation ---
    const NavigationSidebar = ({ onOpenSearch, onOpenSqlSchema }) => {
      const { activeTab, setActiveTab, notifications, currentUser } = useApp();
      const unreadNotifications = notifications.filter(n => !n.read).length;

      return (
        <div className="w-18 md:w-20 bg-dark-surface border-r border-dark-border flex flex-col items-center py-4 justify-between select-none z-20">
          {/* Top Branding Logo */}
          <div className="flex flex-col items-center gap-6 w-full">
            <div 
              onClick={() => setActiveTab('home')} 
              className="relative group cursor-pointer"
            >
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-all duration-300">
                <span className="font-black text-xl tracking-tighter">NC</span>
              </div>
              <div className="absolute left-16 top-2 bg-gray-900 text-xs px-2 py-1 rounded shadow-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                NoahCord Home
              </div>
            </div>

            <div className="w-8 h-[1px] bg-dark-border" />

            {/* Main Navigation Items */}
            <div className="flex flex-col gap-3 w-full px-3">
              {[
                { id: 'home', icon: 'message', label: 'Chats & Direct' },
                { id: 'friends', icon: 'users', label: 'Friends Hub', badge: 1 },
                { id: 'notifications', icon: 'bell', label: 'Notifications', badge: unreadNotifications },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`relative group w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-200 mx-auto ${
                    activeTab === item.id 
                      ? 'bg-brand-500 text-white shadow-md glow-accent scale-105' 
                      : 'text-gray-400 hover:bg-dark-panel hover:text-gray-100'
                  }`}
                >
                  <Icon name={item.icon} size={20} />
                  {item.badge > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-dark-surface animate-bounce-subtle">
                      {item.badge}
                    </span>
                  )}
                  <span className="absolute left-16 bg-gray-900 text-xs px-2.5 py-1 rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                    {item.label}
                  </span>
                </button>
              ))}

              <button
                onClick={onOpenSearch}
                className="group w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:bg-dark-panel hover:text-gray-100 transition-all duration-200 mx-auto"
              >
                <Icon name="search" size={20} />

    };

    // --- Component: Notifications Center ---
    const NotificationsView = () => {
      const { notifications, setNotifications } = useApp();

      return (
        <div className="flex-1 flex flex-col h-full bg-dark-bg p-8 overflow-y-auto">
          <div className="max-w-2xl mx-auto w-full">
            <div className="flex items-center justify-between border-b border-dark-border pb-4 mb-6">
              <div className="flex items-center gap-3">
                <Icon name="bell" className="text-brand-500" size={24} />
                <h1 className="text-2xl font-black text-gray-100">Notification Center</h1>
              </div>
              <button 
                onClick={() => setNotifications(prev => prev.map(n => ({ ...n, read: true })))}
                className="text-xs text-brand-400 hover:underline"
              >
                Mark all as read
              </button>
            </div>

            <div className="space-y-3">
              {notifications.map(n => (
                <div key={n.id} className={`p-4 rounded-2xl border transition ${n.read ? 'bg-dark-surface/40 border-dark-border opacity-70' : 'bg-dark-surface border-brand-500/30 glow-accent'}`}>
                  <div className="flex justify-between items-start">
                    <h4 className="font-bold text-sm text-gray-200">{n.title}</h4>
                    <span className="text-[10px] text-gray-500">{n.time}</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-1">{n.body}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- Component: Settings & Theme Switcher ---
    const SettingsView = () => {
      const { currentUser, setCurrentUser, theme, setTheme, supabaseConfig, setSupabaseConfig } = useApp();

      const themesList = [
        { id: 'midnight', name: 'Midnight Dark', bg: '#07090e', accent: '#38bdf8' },
        { id: 'black', name: 'Pitch Black', bg: '#000000', accent: '#22d3ee' },
        { id: 'dark-blue', name: 'Deep Navy Blue', bg: '#0a1128', accent: '#60a5fa' },
        { id: 'cyan-neon', name: 'Cyan Cyberpunk', bg: '#021a1a', accent: '#2dd4bf' },
        { id: 'heart-pink', name: 'Heart Pink', bg: '#1f040d', accent: '#f43f5e' },
        { id: 'rose', name: 'Velvet Rose', bg: '#18060c', accent: '#fb7185' },
        { id: 'white', name: 'Clean Light', bg: '#f8fafc', accent: '#0284c7' },
      ];

      return (
        <div className="flex-1 flex flex-col h-full bg-dark-bg p-8 overflow-y-auto">
          <div className="max-w-3xl mx-auto w-full space-y-8">
            <div className="border-b border-dark-border pb-4">
              <h1 className="text-2xl font-black text-gray-100">Account & Preferences</h1>
              <p className="text-xs text-gray-400">Customize your theme, profile details, and Supabase database config.</p>
            </div>

            {/* Profile Customization Section */}
            <div className="bg-dark-surface border border-dark-border p-6 rounded-3xl space-y-4">
              <h3 className="font-bold text-gray-200 flex items-center gap-2">
                <Icon name="sparkles" className="text-brand-500" /> User Profile Info
              </h3>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-semibold text-gray-400">Display Name</label>
                  <input
                    type="text"
                    value={currentUser.displayName}
                    onChange={(e) => setCurrentUser({ ...currentUser, displayName: e.target.value })}
                    className="w-full mt-1 bg-dark-panel border border-dark-border rounded-xl px-3 py-2 text-sm text-gray-100"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-gray-400">Status Emoji & Tag</label>
                  <input
                    type="text"
                    value={currentUser.customStatus}
                    onChange={(e) => setCurrentUser({ ...currentUser, customStatus: e.target.value })}
                    className="w-full mt-1 bg-dark-panel border border-dark-border rounded-xl px-3 py-2 text-sm text-gray-100"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400">Bio</label>
                <textarea
                  rows="2"
                  value={currentUser.bio}
                  onChange={(e) => setCurrentUser({ ...currentUser, bio: e.target.value })}
                  className="w-full mt-1 bg-dark-panel border border-dark-border rounded-xl px-3 py-2 text-sm text-gray-100"
                />
              </div>
            </div>

            {/* Instant Theme Selector */}
            <div className="bg-dark-surface border border-dark-border p-6 rounded-3xl space-y-4">
              <h3 className="font-bold text-gray-200 flex items-center gap-2">
                <Icon name="settings" className="text-brand-500" /> Color Theme Preset
              </h3>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                {themesList.map(t => (
                  <button
                    key={t.id}
                    onClick={() => setTheme(t.id)}
                    className={`p-3 rounded-2xl border text-left flex flex-col justify-between h-20 transition ${
                      theme === t.id ? 'ring-2 ring-brand-500 border-transparent shadow-lg' : 'border-dark-border hover:border-gray-600'
                    }`}
                    style={{ backgroundColor: t.bg }}
                  >
                    <span className="text-xs font-bold" style={{ color: t.accent }}>{t.name}</span>
                    <div className="w-5 h-5 rounded-full" style={{ backgroundColor: t.accent }} />
                  </button>
                ))}
              </div>
            </div>

            {/* Supabase Connection Setup */}
            <div className="bg-dark-surface border border-dark-border p-6 rounded-3xl space-y-4">
              <h3 className="font-bold text-gray-200 flex items-center gap-2">
                <Icon name="database" className="text-emerald-400" /> Live Supabase Credentials
              </h3>
              <p className="text-xs text-gray-400">Optionally connect your real Supabase instance for live database backend persistence.</p>

              <div className="space-y-3">
                <input
                  type="text"
                  placeholder="Supabase URL (e.g. https://xyz.supabase.co)"
                  value={supabaseConfig.url}
                  onChange={(e) => setSupabaseConfig({ ...supabaseConfig, url: e.target.value })}
                  className="w-full bg-dark-panel border border-dark-border rounded-xl px-3 py-2 text-sm text-gray-100"
                />
                <input
                  type="password"
                  placeholder="Supabase Anon Key"
                  value={supabaseConfig.key}
                  onChange={(e) => setSupabaseConfig({ ...supabaseConfig, key: e.target.value })}
                  className="w-full bg-dark-panel border border-dark-border rounded-xl px-3 py-2 text-sm text-gray-100"
                />
                <button 
                  onClick={() => {
                    localStorage.setItem('noahcord_sb_url', supabaseConfig.url);
                    localStorage.setItem('noahcord_sb_key', supabaseConfig.key);
                    alert('Supabase credentials stored successfully!');
                  }}
                  className="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition"
                >
                  Save & Connect Backend
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Modal Component: Supabase SQL Schema Inspector ---
    const SqlSchemaModal = ({ isOpen, onClose }) => {
      if (!isOpen) return null;

      const sqlCode = `-- NoahCord Production PostgreSQL Migration & RLS Policies Schema
-- Run this in your Supabase SQL Editor to initialize full database setup

-- 1. PROFILES TABLE
CREATE TABLE IF NOT EXISTS public.profiles (
  id UUID REFERENCES auth.users ON DELETE CASCADE PRIMARY KEY,
  username TEXT UNIQUE NOT NULL,
  display_name TEXT,
  avatar_url TEXT,
  banner_url TEXT,
  bio TEXT,
  status TEXT DEFAULT 'online',
  custom_status TEXT,
  accent_color TEXT DEFAULT '#06b6d4',
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- 2. MESSAGES TABLE
CREATE TABLE IF NOT EXISTS public.messages (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  channel_id TEXT NOT NULL,
  sender_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE,
  content TEXT,
  attachment_url TEXT,
  sticker_url TEXT,
  gif_url TEXT,
  reply_to_id UUID,
  is_pinned BOOLEAN DEFAULT false,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- 3. GROUP CHATS & MEMBERS
CREATE TABLE IF NOT EXISTS public.group_chats (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name TEXT NOT NULL,
  icon TEXT,
  description TEXT,
  admin_id UUID REFERENCES public.profiles(id)
);

CREATE TABLE IF NOT EXISTS public.group_members (
  group_id UUID REFERENCES public.group_chats(id) ON DELETE CASCADE,
  user_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE,
  PRIMARY KEY (group_id, user_id)
);

-- ROW LEVEL SECURITY (RLS) POLICIES
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.messages ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Public profiles are viewable by everyone." ON public.profiles FOR SELECT USING (true);
CREATE POLICY "Users can update own profile." ON public.profiles FOR UPDATE USING (auth.uid() = id);

CREATE POLICY "Authenticated users can read messages." ON public.messages FOR SELECT USING (auth.role() = 'authenticated');
CREATE POLICY "Users can insert messages." ON public.messages FOR INSERT WITH CHECK (auth.uid() = sender_id);
`;

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-dark-surface border border-dark-border w-full max-w-3xl rounded-3xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div className="flex items-center justify-between pb-4 border-b border-dark-border">
              <div className="flex items-center gap-2 text-emerald-400">
                <Icon name="database" size={22} />
                <h3 className="font-bold text-lg text-gray-100">Supabase Auto-Generated Migration Schema</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
            </div>

            <div className="flex-1 overflow-y-auto my-4 bg-black/60 p-4 rounded-2xl border border-white/5">
              <pre className="text-xs text-emerald-300 font-mono leading-relaxed whitespace-pre-wrap">{sqlCode}</pre>
            </div>

            <div className="flex justify-end gap-3 pt-2">
              <button 
                onClick={() => { navigator.clipboard.writeText(sqlCode); alert('SQL Copied to Clipboard!'); }}
                className="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs px-5 py-2.5 rounded-xl flex items-center gap-2 transition"
              >
                <Icon name="copy" size={14} /> Copy SQL Script
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Modal Component: Global Quick Search Modal ---
    const SearchModal = ({ isOpen, onClose }) => {
      const [query, setQuery] = useState('');
      const { friends, groups } = useApp();

      if (!isOpen) return null;

      const filteredFriends = friends.filter(f => f.displayName.toLowerCase().includes(query.toLowerCase()));
      const filteredGroups = groups.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-start justify-center pt-20 p-4">
          <div className="bg-dark-surface border border-dark-border w-full max-w-xl rounded-2xl p-4 shadow-2xl space-y-4 animate-fade-in">
            <div className="flex items-center gap-3 bg-dark-panel px-3 py-2.5 rounded-xl border border-dark-border">
              <Icon name="search" className="text-gray-400" size={18} />
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search users, groups, or commands..."
                className="flex-1 bg-transparent text-sm text-gray-100 focus:outline-none"
                autoFocus
              />
              <button onClick={onClose} className="text-xs text-gray-400 hover:text-white bg-dark-surface px-2 py-1 rounded">ESC</button>
            </div>

            <div className="max-h-60 overflow-y-auto space-y-3">
              <div>
                <div className="text-[10px] font-bold text-gray-500 uppercase px-2 mb-1">Friends</div>
                {filteredFriends.map(f => (
                  <div key={f.id} onClick={onClose} className="p-2 hover:bg-dark-panel rounded-xl flex items-center gap-3 cursor-pointer">
                    <img src={f.avatar} className="w-8 h-8 rounded-full object-cover" alt="" />
                    <span className="text-sm text-gray-200">{f.displayName}</span>
                  </div>
                ))}
              </div>

              <div>
                <div className="text-[10px] font-bold text-gray-500 uppercase px-2 mb-1">Groups</div>
                {filteredGroups.map(g => (
                  <div key={g.id} onClick={onClose} className="p-2 hover:bg-dark-panel rounded-xl flex items-center gap-3 cursor-pointer">
                    <span>{g.icon}</span>
                    <span className="text-sm text-gray-200">{g.name}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Main Layout Container ---
    const MainApp = () => {
      const { activeTab } = useApp();
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isSqlModalOpen, setIsSqlModalOpen] = useState(false);

      // Keyboard shortcut listener for Cmd+K Search
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setIsSearchOpen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-dark-bg text-gray-100">
          {/* Main Icon Sidebar */}
          <NavigationSidebar 
            onOpenSearch={() => setIsSearchOpen(true)} 
            onOpenSqlSchema={() => setIsSqlModalOpen(true)}
          />

          {/* Secondary List Column for Home & Direct Messages */}
          {activeTab === 'home' && <ChannelListSidebar />}

          {/* Main Content Workspace View */}
          <div className="flex-1 flex h-full overflow-hidden">
            {activeTab === 'home' && <ChatArea />}
            {activeTab === 'friends' && <FriendsView />}
            {activeTab === 'notifications' && <NotificationsView />}
            {activeTab === 'settings' && <SettingsView />}
          </div>

          {/* Floating Modals */}
          <SearchModal isOpen={isSearchOpen} onClose={() => setIsSearchOpen(false)} />
          <SqlSchemaModal isOpen={isSqlModalOpen} onClose={() => setIsSqlModalOpen(false)} />
        </div>
      );
    };

    // --- Entry Point Render ---
    const Root = () => (
      <AppProvider>
        <MainApp />
      </AppProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
